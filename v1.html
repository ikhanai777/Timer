<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Proto-Timer v1</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --green: #7dffa0;
    --green-mid: #3fdc6a;
    --green-dim: rgba(125, 255, 160, 0.07);
    --glow: rgba(60, 255, 110, 0.55);
    --glow-soft: rgba(60, 255, 110, 0.18);
    --text: #8dfbab;
    --panel: #000;
    --bg: #000;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* Whole app is sized to the viewport; on the S25 Ultra that is ~412x915 CSS px. */
  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      calc(env(safe-area-inset-top, 0px) + 3.5vh)
      calc(env(safe-area-inset-right, 0px) + 6vw)
      calc(env(safe-area-inset-bottom, 0px) + 3vh)
      calc(env(safe-area-inset-left, 0px) + 6vw);
    gap: 3.2vh;
    background: radial-gradient(ellipse at 50% 45%, rgba(40, 255, 100, 0.10), transparent 70%), var(--bg);
  }

  /* ---------- Main panel ---------- */
  .panel {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 44px;
    box-shadow:
      0 0 0 1px rgba(125, 255, 160, 0.06),
      0 0 40px 6px var(--glow-soft),
      0 0 110px 20px rgba(60, 255, 110, 0.10);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3.4vh 7% 2.6vh;
  }

  .label {
    font-size: clamp(22px, 3.6vh, 34px);
    letter-spacing: 0.02em;
    color: var(--text);
    text-shadow: 0 0 10px var(--glow);
    line-height: 1;
  }

  .brand {
    font-size: clamp(16px, 2.6vh, 24px);
    color: var(--text);
    text-shadow: 0 0 8px var(--glow);
    margin-top: 2.4vh;
    letter-spacing: 0.02em;
  }

  /* ---------- 7‑segment display ---------- */
  .display {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 1.6vh;
    gap: 1.2%;
    filter: drop-shadow(0 0 6px var(--glow));
  }
  .digit { height: clamp(52px, 8.6vh, 88px); width: auto; flex: 0 1 auto; }
  .digit polygon { fill: var(--green-dim); transition: fill 0.08s; }
  .digit polygon.on { fill: var(--green); }
  .colon { height: clamp(52px, 8.6vh, 88px); width: auto; flex: 0 0 auto; }
  .colon circle { fill: var(--green); }
  .display.blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }

  /* ---------- Charging bar ---------- */
  .meter-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 4.5vh;
  }
  .meter {
    height: 100%;
    width: clamp(96px, 30%, 150px);
    border: 3px solid var(--green);
    border-radius: 16px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column-reverse; /* bar 0 at the bottom */
    gap: 1.2%;
    box-shadow: 0 0 14px var(--glow), inset 0 0 12px rgba(60, 255, 110, 0.25);
    position: relative;
  }
  .meter::before {
    /* soft green halo behind the lit bars */
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: radial-gradient(ellipse at 50% 60%, rgba(60, 255, 110, 0.18), transparent 70%);
    pointer-events: none;
  }
  .bar {
    flex: 1 1 0;
    min-height: 3px;
    border-radius: 5px;
    background: rgba(125, 255, 160, 0.08);
    box-shadow: inset 0 0 0 1px rgba(125, 255, 160, 0.04);
    transition: background 0.25s, box-shadow 0.25s;
  }
  .bar.on {
    background: linear-gradient(180deg, #b6ffc8, var(--green) 45%, #5cf585);
    box-shadow: 0 0 8px var(--glow), 0 0 18px rgba(60, 255, 110, 0.35);
  }
  .bar.charging { animation: charge 1.1s ease-in-out infinite; }
  @keyframes charge {
    0%, 100% { background: rgba(125, 255, 160, 0.10); box-shadow: none; }
    50% { background: rgba(125, 255, 160, 0.55); box-shadow: 0 0 10px var(--glow); }
  }
  .meter.done .bar { animation: flash 0.6s steps(1) infinite; }
  @keyframes flash { 50% { background: rgba(125, 255, 160, 0.08); box-shadow: none; } }

  /* ---------- Buttons ---------- */
  .controls {
    flex: 0 0 auto;
    width: 100%;
    max-width: 480px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4.5%;
    padding: 0 1%;
  }
  .btn {
    aspect-ratio: 1 / 1;
    width: 100%;
    border-radius: 18px;
    border: 3px solid var(--green);
    background:
      radial-gradient(circle at 50% 35%, #4a4d4b, #2b2d2c 60%, #1c1d1c);
    box-shadow:
      0 0 12px var(--glow),
      0 0 26px rgba(60, 255, 110, 0.25),
      inset 0 0 0 5px #111,
      inset 0 2px 6px rgba(255, 255, 255, 0.12);
    color: var(--text);
    font: inherit;
    font-size: clamp(13px, 2.1vh, 19px);
    line-height: 1.05;
    text-shadow: 0 0 6px var(--glow);
    padding: 0;
    cursor: pointer;
    transition: transform 0.08s, filter 0.15s, box-shadow 0.15s;
  }
  .btn.small { font-size: clamp(10px, 1.5vh, 14px); }
  .btn:active { transform: scale(0.94); filter: brightness(1.25); }
  .btn:disabled { opacity: 0.4; filter: grayscale(0.4); }
  .btn.active { box-shadow: 0 0 18px var(--glow), 0 0 40px rgba(60, 255, 110, 0.45), inset 0 0 0 5px #111, inset 0 0 14px rgba(125, 255, 160, 0.35); }

  /* ---------- Settings sheet ---------- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    width: 100%;
    max-width: 520px;
    max-height: 92dvh;
    overflow-y: auto;
    background: #050805;
    border: 2px solid var(--green);
    border-bottom: none;
    border-radius: 28px 28px 0 0;
    box-shadow: 0 0 30px var(--glow-soft);
    padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
    animation: up 0.22s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 {
    margin: 0 0 16px;
    font-weight: 500;
    font-size: 22px;
    text-align: center;
    text-shadow: 0 0 8px var(--glow);
  }
  .section-title {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
    margin: 18px 0 10px;
  }

  .time-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .unit span { font-size: 12px; letter-spacing: 0.1em; opacity: 0.7; }
  .step {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(125, 255, 160, 0.4);
    background: #0c140e;
    color: var(--green);
    font-size: 22px;
    cursor: pointer;
  }
  .step:active { background: #16301c; }
  .unit input {
    width: 100%;
    height: 64px;
    text-align: center;
    font-size: 36px;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    color: var(--green);
    background: #000;
    border: 2px solid var(--green);
    border-radius: 14px;
    box-shadow: 0 0 10px var(--glow-soft);
    outline: none;
    -moz-appearance: textfield;
  }
  .unit input::-webkit-outer-spin-button,
  .unit input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip {
    height: 42px;
    border-radius: 21px;
    border: 1px solid rgba(125, 255, 160, 0.45);
    background: #000;
    color: var(--text);
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .chip:active, .chip.sel { background: #123a1c; border-color: var(--green); box-shadow: 0 0 10px var(--glow-soft); }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 1px solid rgba(125, 255, 160, 0.1);
    font-size: 16px;
  }
  .seg { display: flex; border: 1px solid rgba(125, 255, 160, 0.45); border-radius: 10px; overflow: hidden; }
  .seg button {
    background: #000;
    color: var(--text);
    border: none;
    padding: 8px 12px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .seg button.sel { background: #123a1c; color: #c8ffd6; }

  .switch { position: relative; width: 52px; height: 30px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i {
    position: absolute; inset: 0;
    border-radius: 15px;
    background: #1a1f1b;
    border: 1px solid rgba(125, 255, 160, 0.35);
    transition: background 0.2s;
  }
  .switch i::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #5a6b5e; transition: transform 0.2s, background 0.2s;
  }
  .switch input:checked + i { background: #123a1c; border-color: var(--green); }
  .switch input:checked + i::after { transform: translateX(22px); background: var(--green); box-shadow: 0 0 8px var(--glow); }

  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .sheet-actions button {
    height: 52px;
    border-radius: 14px;
    font: inherit;
    font-size: 17px;
    cursor: pointer;
  }
  .cancel { background: #000; color: var(--text); border: 1px solid rgba(125, 255, 160, 0.45); }
  .save { background: var(--green); color: #002a0c; border: none; font-weight: 600; box-shadow: 0 0 16px var(--glow); }
</style>
</head>
<body>
<main class="app">
  <section class="panel">
    <div class="label">TIMER</div>
    <div class="display" id="display" aria-live="polite" aria-label="00:00:00"></div>
    <div class="meter-wrap">
      <div class="meter" id="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
    <div class="brand">PROTO-TIMER</div>
  </section>

  <nav class="controls">
    <button class="btn" id="startBtn">START</button>
    <button class="btn" id="stopBtn">STOP</button>
    <button class="btn" id="resetBtn">RESET</button>
    <button class="btn small" id="settingsBtn">TIMER<br>SETTINGS</button>
  </nav>
</main>

<div class="sheet-backdrop" id="sheet">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Timer Settings</h2>

    <div class="section-title">Time limit</div>
    <div class="time-picker">
      <div class="unit">
        <button class="step" data-unit="h" data-d="1">▲</button>
        <input id="inH" type="number" inputmode="numeric" min="0" max="99" value="0">
        <button class="step" data-unit="h" data-d="-1">▼</button>
        <span>HOURS</span>
      </div>
      <div class="unit">
        <button class="step" data-unit="m" data-d="1">▲</button>
        <input id="inM" type="number" inputmode="numeric" min="0" max="59" value="0">
        <button class="step" data-unit="m" data-d="-1">▼</button>
        <span>MINUTES</span>
      </div>
      <div class="unit">
        <button class="step" data-unit="s" data-d="1">▲</button>
        <input id="inS" type="number" inputmode="numeric" min="0" max="59" value="0">
        <button class="step" data-unit="s" data-d="-1">▼</button>
        <span>SECONDS</span>
      </div>
    </div>

    <div class="section-title">Presets</div>
    <div class="presets" id="presets"></div>

    <div class="section-title">Options</div>
    <div class="row">
      <span>Bars show</span>
      <div class="seg" id="barMode">
        <button data-v="charge">Charge up</button>
        <button data-v="drain">Drain</button>
      </div>
    </div>
    <label class="row"><span>Alarm sound</span><span class="switch"><input type="checkbox" id="optSound"><i></i></span></label>
    <label class="row"><span>Vibrate on finish</span><span class="switch"><input type="checkbox" id="optVibrate"><i></i></span></label>
    <label class="row"><span>Keep screen on while running</span><span class="switch"><input type="checkbox" id="optWake"><i></i></span></label>

    <div class="sheet-actions">
      <button class="cancel" id="cancelBtn">Cancel</button>
      <button class="save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Settings (persisted) ----------
  const DEFAULTS = { duration: 45 * 60, barMode: 'charge', sound: true, vibrate: true, wake: true };
  const STORE_KEY = 'proto-timer-settings';
  let settings = { ...DEFAULTS };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (_) {}
  const saveSettings = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (_) {} };

  const BAR_COUNT = 25;
  const MAX_SECONDS = 99 * 3600 + 59 * 60 + 59;

  // ---------- 7-segment digits ----------
  const SEGMENTS = {
    a: '10,7 16,1 44,1 50,7 44,13 16,13',
    b: '53,11 59,17 59,43 53,49 47,43 47,17',
    c: '53,51 59,57 59,83 53,89 47,83 47,57',
    d: '10,93 16,87 44,87 50,93 44,99 16,99',
    e: '7,51 13,57 13,83 7,89 1,83 1,57',
    f: '7,11 13,17 13,43 7,49 1,43 1,17',
    g: '10,50 16,44 44,44 50,50 44,56 16,56',
  };
  const DIGIT_SEGS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const displayEl = document.getElementById('display');
  const digits = [];

  function makeDigit() {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '-4 0 70 100');
    svg.classList.add('digit');
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('transform', 'skewX(-6) translate(6 0)');
    const segs = {};
    for (const [k, pts] of Object.entries(SEGMENTS)) {
      const p = document.createElementNS(SVG_NS, 'polygon');
      p.setAttribute('points', pts);
      g.appendChild(p);
      segs[k] = p;
    }
    svg.appendChild(g);
    displayEl.appendChild(svg);
    return segs;
  }
  function makeColon() {
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 14 100');
    svg.classList.add('colon');
    for (const [cx, cy] of [[8, 32], [5, 70]]) {
      const c = document.createElementNS(SVG_NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 5);
      svg.appendChild(c);
    }
    displayEl.appendChild(svg);
  }
  for (let i = 0; i < 6; i++) {
    digits.push(makeDigit());
    if (i === 1 || i === 3) makeColon();
  }

  let lastText = '';
  function renderTime(totalSec) {
    const s = Math.max(0, Math.min(MAX_SECONDS, totalSec));
    const text = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
      .map(n => String(n).padStart(2, '0')).join('');
    if (text === lastText) return;
    lastText = text;
    for (let i = 0; i < 6; i++) {
      const on = DIGIT_SEGS[+text[i]];
      for (const [k, el] of Object.entries(digits[i])) el.classList.toggle('on', on.includes(k));
    }
    displayEl.setAttribute('aria-label', `${text.slice(0, 2)}:${text.slice(2, 4)}:${text.slice(4)}`);
  }

  // ---------- Bars ----------
  const meterEl = document.getElementById('meter');
  const bars = Array.from({ length: BAR_COUNT }, () => {
    const b = document.createElement('div');
    b.className = 'bar';
    meterEl.appendChild(b);
    return b;
  });

  function renderBars(elapsedFrac, running) {
    const frac = settings.barMode === 'drain' ? 1 - elapsedFrac : elapsedFrac;
    const exact = Math.max(0, Math.min(1, frac)) * BAR_COUNT;
    const lit = settings.barMode === 'drain' ? Math.ceil(exact - 1e-9) : Math.floor(exact + 1e-9);
    // The bar currently being charged / drained pulses while running.
    const activeIdx = running ? (settings.barMode === 'drain' ? lit - 1 : lit) : -1;
    bars.forEach((b, i) => {
      const charging = i === activeIdx && i >= 0 && i < BAR_COUNT;
      b.classList.toggle('on', i < lit && !charging);
      b.classList.toggle('charging', charging);
    });
    meterEl.setAttribute('aria-valuenow', Math.round(elapsedFrac * 100));
  }

  // ---------- Timer state ----------
  // Time is derived from Date.now() so it stays accurate even if the tab is throttled.
  let remainingMs = settings.duration * 1000;
  let endAt = 0;           // timestamp when the running timer hits zero
  let running = false;
  let finished = false;
  let rafId = 0;

  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  function currentRemaining() {
    return running ? Math.max(0, endAt - Date.now()) : remainingMs;
  }

  function render() {
    const rem = currentRemaining();
    const total = settings.duration * 1000;
    renderTime(Math.ceil(rem / 1000));
    renderBars(total > 0 ? 1 - rem / total : 0, running);
    startBtn.classList.toggle('active', running);
    startBtn.disabled = finished || settings.duration === 0;
  }

  function tick() {
    if (!running) return;
    if (Date.now() >= endAt) return finish();
    render();
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running || finished || settings.duration === 0) return;
    if (remainingMs <= 0) remainingMs = settings.duration * 1000;
    endAt = Date.now() + remainingMs;
    running = true;
    unlockAudio();
    requestWakeLock();
    tick();
  }

  function stop() {
    if (finished) { silenceAlarm(); finished = false; remainingMs = 0; render(); return; }
    if (!running) return;
    remainingMs = Math.max(0, endAt - Date.now());
    running = false;
    cancelAnimationFrame(rafId);
    releaseWakeLock();
    render();
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    silenceAlarm();
    finished = false;
    remainingMs = settings.duration * 1000;
    releaseWakeLock();
    render();
  }

  function finish() {
    running = false;
    finished = true;
    remainingMs = 0;
    cancelAnimationFrame(rafId);
    render();
    displayEl.classList.add('blink');
    meterEl.classList.add('done');
    if (settings.vibrate && navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 800]);
    if (settings.sound) playAlarm();
    releaseWakeLock();
  }

  function silenceAlarm() {
    displayEl.classList.remove('blink');
    meterEl.classList.remove('done');
    stopAlarm();
    if (navigator.vibrate) navigator.vibrate(0);
  }

  // ---------- Audio alarm (Web Audio, no files needed) ----------
  let audioCtx = null;
  let alarmTimer = 0;
  let alarmStopAt = 0;

  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (_) {}
  }
  function beep(t, freq) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.16);
  }
  function playAlarm() {
    unlockAudio();
    if (!audioCtx) return;
    alarmStopAt = Date.now() + 60000; // ring for up to one minute
    const burst = () => {
      if (Date.now() > alarmStopAt) return stopAlarm();
      const t = audioCtx.currentTime + 0.02;
      for (let i = 0; i < 4; i++) beep(t + i * 0.2, 1760);
      if (settings.vibrate && navigator.vibrate) navigator.vibrate([150, 50, 150, 50, 150, 50, 150]);
    };
    burst();
    alarmTimer = setInterval(burst, 1400);
  }
  function stopAlarm() { clearInterval(alarmTimer); alarmTimer = 0; }

  // ---------- Screen wake lock ----------
  let wakeLock = null;
  async function requestWakeLock() {
    if (!settings.wake || !('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (_) {}
  }
  function releaseWakeLock() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (running && !wakeLock) requestWakeLock();
    if (running && Date.now() >= endAt) finish();
    else render();
  });

  // ---------- Settings sheet ----------
  const sheet = document.getElementById('sheet');
  const inH = document.getElementById('inH');
  const inM = document.getElementById('inM');
  const inS = document.getElementById('inS');
  const inputs = { h: inH, m: inM, s: inS };
  const limits = { h: 99, m: 59, s: 59 };
  const barModeEl = document.getElementById('barMode');
  const optSound = document.getElementById('optSound');
  const optVibrate = document.getElementById('optVibrate');
  const optWake = document.getElementById('optWake');
  const presetsEl = document.getElementById('presets');
  let draftBarMode = settings.barMode;

  const PRESETS = [
    ['1 min', 60], ['3 min', 180], ['5 min', 300], ['10 min', 600],
    ['15 min', 900], ['30 min', 1800], ['45 min', 2700], ['1 hr', 3600],
  ];
  PRESETS.forEach(([label, sec]) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.dataset.sec = sec;
    b.addEventListener('click', () => { setInputs(sec); markPreset(); });
    presetsEl.appendChild(b);
  });

  const clampUnit = (u, v) => Math.max(0, Math.min(limits[u], Math.floor(Number(v) || 0)));
  function setInputs(sec) {
    inH.value = Math.floor(sec / 3600);
    inM.value = Math.floor(sec / 60) % 60;
    inS.value = sec % 60;
  }
  function inputSeconds() {
    return clampUnit('h', inH.value) * 3600 + clampUnit('m', inM.value) * 60 + clampUnit('s', inS.value);
  }
  function markPreset() {
    const sec = inputSeconds();
    presetsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', +c.dataset.sec === sec));
  }
  function markBarMode() {
    barModeEl.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.v === draftBarMode));
  }

  document.querySelectorAll('.step').forEach(btn => {
    btn.addEventListener('click', () => {
      const u = btn.dataset.unit;
      const el = inputs[u];
      const max = limits[u];
      let v = clampUnit(u, el.value) + Number(btn.dataset.d);
      if (v > max) v = 0;
      if (v < 0) v = max;
      el.value = v;
      markPreset();
    });
  });
  Object.entries(inputs).forEach(([u, el]) => {
    el.addEventListener('focus', () => el.select());
    el.addEventListener('input', markPreset);
    el.addEventListener('blur', () => { el.value = clampUnit(u, el.value); markPreset(); });
  });
  barModeEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    draftBarMode = b.dataset.v;
    markBarMode();
  });

  function openSettings() {
    setInputs(settings.duration);
    draftBarMode = settings.barMode;
    optSound.checked = settings.sound;
    optVibrate.checked = settings.vibrate;
    optWake.checked = settings.wake;
    markPreset();
    markBarMode();
    sheet.classList.add('open');
  }
  function closeSettings() { sheet.classList.remove('open'); }

  function applySettings() {
    const newDuration = inputSeconds();
    const durationChanged = newDuration !== settings.duration;
    settings.duration = newDuration;
    settings.barMode = draftBarMode;
    settings.sound = optSound.checked;
    settings.vibrate = optVibrate.checked;
    settings.wake = optWake.checked;
    saveSettings();
    closeSettings();
    if (durationChanged) reset();      // a new time limit starts fresh
    else {
      if (!settings.wake) releaseWakeLock();
      else if (running) requestWakeLock();
      render();
    }
  }

  document.getElementById('settingsBtn').addEventListener('click', openSettings);
  document.getElementById('cancelBtn').addEventListener('click', closeSettings);
  document.getElementById('saveBtn').addEventListener('click', applySettings);
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSettings(); });

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  document.getElementById('resetBtn').addEventListener('click', reset);

  // ---------- Offline support ----------
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  render();
})();
</script>
</body>
</html>
